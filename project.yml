name: TrackPeek

options:
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "4"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.4

targets:
  TrackPeek:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Shared
    dependencies:
      - sdk: CoreAudio.framework
      - package: Sparkle
      - target: TrackPeekScriptHelper
        link: false
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    info:
      path: Sources/Info.plist
      properties:
        LSUIElement: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppleEventsUsageDescription: "TrackPeek uses Automation to read the current track and control Spotify or Apple Music."
        NSAudioCaptureUsageDescription: "TrackPeek analyzes Spotify system audio so the equalizer responds to the music."
        SUFeedURL: https://github.com/Komortes/TrackPeek/releases/latest/download/appcast.xml
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUPublicEDKey: "sWZKEDp9cNT0tBU07drKze1pKrne087vMriQmheJnUs="
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trackpeek.TrackPeek
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Support/TrackPeek-Bridging-Header.h
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_ENTITLEMENTS: Config/TrackPeek.entitlements
        DEVELOPMENT_TEAM: 97JZ23LR73
        ENABLE_HARDENED_RUNTIME: YES

  TrackPeekScriptHelper:
    type: tool
    platform: macOS
    sources:
      - path: Helpers/TrackPeekScriptHelper
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trackpeek.TrackPeek.ScriptHelper
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "TrackPeek uses Automation to read the current track and control Spotify or Apple Music."
        INFOPLIST_KEY_LSUIElement: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_ENTITLEMENTS: Config/TrackPeek.entitlements
        DEVELOPMENT_TEAM: 97JZ23LR73
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES

  TrackPeekTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: TrackPeek
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trackpeek.TrackPeekTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: 97JZ23LR73

schemes:
  TrackPeek:
    build:
      targets:
        TrackPeek: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TrackPeekTests
