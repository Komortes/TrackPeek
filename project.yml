name: TrackPeek

options:
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "6.0"

targets:
  TrackPeek:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - sdk: CoreAudio.framework
    info:
      path: Sources/Info.plist
      properties:
        LSUIElement: true
        NSAppleEventsUsageDescription: "TrackPeek использует Automation для чтения текущего трека и управления Spotify."
        NSAudioCaptureUsageDescription: "TrackPeek анализирует системное аудио Spotify, чтобы эквалайзер двигался в ритм музыки."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trackpeek.TrackPeek
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Support/TrackPeek-Bridging-Header.h
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES

  TrackPeekTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: TrackPeek
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trackpeek.TrackPeekTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TrackPeek:
    build:
      targets:
        TrackPeek: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TrackPeekTests
