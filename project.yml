name: TrackPeek

options:
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "6.0"

targets:
  TrackPeek:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trackpeek.TrackPeek
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "TrackPeek использует Automation для чтения текущего трека и управления Spotify."
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES

  TrackPeekTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: TrackPeek
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trackpeek.TrackPeekTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TrackPeek:
    build:
      targets:
        TrackPeek: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TrackPeekTests
